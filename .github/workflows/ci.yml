# CI mínimo (Etapa 0 do plano de consolidação, docs/refactor/plano-consolidacao-2026-07-29.md).
# Espelha o alias `mix precommit` — com as variantes --check-* que verificam em vez
# de mutar. Roda em Linux de propósito: todo caminho que toca macOS de verdade
# (SCK, osascript, helper de teclas) é desligado no env de teste, e é exatamente
# isso que este workflow também prova a cada PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix deps.unlock --check-unused
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      # `mix compile` only reaches elixirc_paths(:test) — "lib" and "test/support".
      # The *_test.exs files are compiled by `mix test`, so 41 warnings lived
      # there for as long as anyone can remember: the gate had never looked at
      # them. This flag is that gate.
      - run: mix test --warnings-as-errors

  # Credo e dialyzer são o alias `mix lint`, e até agora ninguém os rodava a não
  # ser à mão — foi assim que 38 apontamentos do credo e 19 do dialyzer (um
  # `no_return` que apagava dez funções do cavebot da análise) se acumularam sem
  # ninguém ver. A PLT vai no cache: só a primeira execução paga por ela.
  lint:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-dev-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-dev-${{ runner.os }}-

      # A PLT carrega o BEAM inteiro dentro dela, então ela é do par
      # OTP+Elixir tanto quanto do mix.lock. Sem as versões na chave, o
      # `restore-keys` devolvia alegremente uma PLT de outro par e o dialyzer
      # parava a CI com "Old PLT file" — vermelho que não é do código de
      # ninguém (01/09, PR #469).
      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-otp27-ex1.19.5-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-otp27-ex1.19.5-

      - run: mix deps.get
      - run: mix credo
      # Constrói/atualiza a PLT como PASSO PRÓPRIO: uma PLT restaurada de um
      # mix.lock vizinho é atualizável, e atualizar é barato perto de rodar a
      # análise duas vezes. Sem isto, "quase certa" é fatal em vez de ser
      # consertada.
      - run: mix dialyzer --plt
      - run: mix dialyzer

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-dev-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-dev-${{ runner.os }}-

      - run: mix deps.get
      - run: mix assets.setup
      - run: mix assets.build
